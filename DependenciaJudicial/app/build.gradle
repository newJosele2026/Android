apply plugin: 'com.android.application'

def dbflow_version = "4.1.2"
def android_version = "27.+"
def sqlcipher_version = "3.5.7"

android {
    signingConfigs {
        config {
            keyAlias 'DependenciJudicialKS'
            keyPassword 'Proyecta2017'
            storeFile file('C:/Users/Josele2015/documentacion josele/DependenciaJudicial/KeyStoreDj.jks')
            storePassword 'Proyecta2017'
        }
    }
    compileSdkVersion 27
    defaultConfig {
        applicationId "com.slt.dependenciajudicial"
        minSdkVersion 22
        targetSdkVersion 27
        versionCode 1
        versionName "0.0.46"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
